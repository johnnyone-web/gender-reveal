
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Gender Spin the Wheel</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue: #4ea8ff;
    --pink: #ff9ac9;
    --bg: #f7f7fb;
    --card-bg: #ffffff;
    --text-main: #222;
    --text-muted: #666;
  }

  body {
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at top, #ffeaf5, #e3f2ff 55%, #ffffff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 12px;
  }

  .container {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.15);
    padding: 18px 14px 24px;
    text-align: center;
  }

  .header-title {
    font-size: 1.6rem;
    font-weight: 800;
    margin-bottom: 6px;
  }

  .header-subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .wheel-wrapper {
    width: 100%;
    max-width: 320px;
    aspect-ratio: 1/1;
    margin: 0 auto 15px;
    position: relative;
  }

  .wheel-frame {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 6px solid #fff;
    box-shadow: 0 0 0 3px rgba(148,163,184,0.4), 0 12px 22px rgba(15,23,42,0.25);
    background: radial-gradient(circle at center, #ffffff 45%, #f3f4ff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #wheelCanvas {
    width: 92%;
    height: 92%;
    border-radius: 50%;
    transition: transform 4s cubic-bezier(0.16,0.9,0.19,1.0);
  }

  .pointer {
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-bottom: 30px solid #111;
    z-index: 10;
  }

  .spin-btn {
    width: 85%;
    max-width: 300px;
    margin: 12px auto;
    padding: 14px 24px;
    font-size: 1.2rem;
    font-weight: 700;
    border: none;
    border-radius: 40px;
    background-image: linear-gradient(135deg, #90c2ff, #f9a8d4);
    color: #111;
    box-shadow: 0 10px 20px rgba(148,163,184,0.5);
    cursor: pointer;
  }

  .result-card {
    display: none;
    margin: 14px auto 0;
    padding: 18px 16px;
    width: 92%;
    max-width: 360px;
    border-radius: 18px;
    background: rgba(255,255,255,0.75);
    border: 1px solid rgba(148,163,184,0.4);
    animation: fadeInUp 0.45s ease-out;
  }

  .result-card.visible { display: block; }

  .result-title {
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .result-body {
    font-size: 1.05rem;
    line-height: 1.35;
    margin-bottom: 14px;
  }

  .registry-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #111;
    color: #fff;
    font-size: 1rem;
    padding: 10px 20px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 8px 18px rgba(15,23,42,0.4);
  }

  @keyframes fadeInUp {
    from {opacity: 0; transform: translateY(15px);}
    to {opacity: 1; transform: translateY(0);}
  }

</style>
</head>

<body>
<div class="container">

  <div class="header-title">Spin to Reveal the Gender ✨</div>
  <div class="header-subtitle">Pink for Girl, Blue for Boy — let the wheel decide!</div>

  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <div class="wheel-frame">
      <canvas id="wheelCanvas" width="320" height="320"></canvas>
    </div>
  </div>

  <button id="spinButton" class="spin-btn">🎡 Spin the Wheel</button>

  <div id="resultCard" class="result-card">
    <div id="resultTitle" class="result-title"></div>
    <div id="resultBody" class="result-body"></div>
    <a href="https://www.babylist.com/list/shashank-shelat" class="registry-btn" target="_blank">
      🛒 View Our Baby Registry
    </a>
  </div>

</div>

<script>
  const canvas = document.getElementById("wheelCanvas");
  const ctx = canvas.getContext("2d");

  const spinButton = document.getElementById("spinButton");
  const resultCard = document.getElementById("resultCard");
  const resultTitle = document.getElementById("resultTitle");
  const resultBody = document.getElementById("resultBody");

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = canvas.width / 2 - 4;

  const segments = [];
  const total = 10;

  for (let i = 0; i < total; i++) {
    const isBoy = i % 2 === 0;
    segments.push({
      type: isBoy ? "BOY" : "GIRL",
      color: isBoy ? "#4ea8ff" : "#ff9ac9",
      icon: isBoy ? "👶🏻💙" : "👶🏻🎀"
    });
  }

  const segAngle = (2 * Math.PI) / total;

  function drawWheel() {
    for (let i = 0; i < total; i++) {
      const seg = segments[i];
      const start = -Math.PI/2 + i*segAngle;
      const end = start + segAngle;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, start, end);
      ctx.fillStyle = seg.color;
      ctx.fill();

      const mid = start + segAngle/2;
      ctx.save();
      ctx.translate(cx + Math.cos(mid)*radius*0.62, cy + Math.sin(mid)*radius*0.62);
      ctx.font = "26px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(seg.icon, 0, 0);
      ctx.restore();
    }
  }

  drawWheel();

  let rotation = 0;
  let busy = false;

  spinButton.onclick = () => {
    if (busy) return;
    busy = true;
    resultCard.classList.remove("visible");

    const spinAmount = 1080 + Math.random()*360;
    rotation += spinAmount;
    canvas.style.transform = `rotate(${rotation}deg)`;

    setTimeout(() => {
      showAlwaysBoy();
      busy = false;
    }, 4000);
  };

  function showAlwaysBoy() {
    resultTitle.textContent = "🎉 It’s a BOY! 💙👶🏻";
    resultBody.textContent = "We’re so excited to welcome our little guy! Here’s our baby registry:";
    resultCard.classList.add("visible");
  }
</script>

</body>
</html>
